name: Scrape rezoning data

on:
  schedule:
    # Runs daily at 8am UTC (~3-4am Eastern). Adjust as needed.
    - cron: '0 8 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Charlotte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrapers/charlotte/index.js
      - name: Mint Hill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrapers/mint_hill/index.js
      # Add one step per remaining town scraper as they're built (Matthews, Pineville,
      # Huntersville, Cornelius, Davidson) — see scrapers/README.md
